<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/variaveis.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/cardapio.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Cardápio</title>
  </head>
  <body>
    <div id="navbar"></div>
    <div id="sidebar"></div>

    <main>
      <section class="container">
        <div class="cardapio-header">
          <h2>Cardápio</h2>
        </div>

        <div class="cardapio-actions">
          <button type="button" class="btn-carrinho">
            <p><i class="fa-solid fa-cart-shopping"></i>Carrinho</p>
          </button>
        </div>

        <div class="filtros-categorias">
          <button class="filtro-btn" data-categoria="todos">Todos</button>
          <button class="filtro-btn" data-categoria="Cafés">Cafés</button>
          <button class="filtro-btn" data-categoria="Bebidas">Bebidas Frias</button>
          <button class="filtro-btn" data-categoria="Doces">Doces</button>
          <button class="filtro-btn" data-categoria="Salgados">Salgados</button>
        </div>

        <div id="cardapio-lista"></div>

        <div id="carrinho-modal" class="modal hidden">
          <div class="modal-content">
            <h3>Carrinho</h3>
            <div id="carrinho-itens"></div>
            <button class="fechar">Fechar</button>
          </div>
        </div>

      </section>
    </main>

    <script type="module" src="../js/cardapio.js"></script>
    <script type="module" src="../js/carrinho.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../scripts/loadComponents.js"></script>
  </body>
</html>
